<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retail Analytics Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #00d4ff;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .tile {
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .GREEN  { background: #1a5e1a; border: 3px solid #00ff00; }
        .YELLOW { background: #5e5e1a; border: 3px solid #ffff00; }
        .RED    { background: #5e1a1a; border: 3px solid #ff0000; }
        .label  { font-size: 13px; color: #ccc; margin-top: 8px; }
        button {
            background: #00d4ff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            display: block;
            margin: 20px auto;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 10px 0;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .dot { width: 15px; height: 15px; border-radius: 50%; }
        .dot-green  { background: #00ff00; }
        .dot-yellow { background: #ffff00; }
        .dot-red    { background: #ff0000; }
    </style>
</head>
<body>
    <h1>🏪 Retail Aisle Monitor</h1>

    <div class="legend">
        <div class="legend-item"><div class="dot dot-green"></div> Safe</div>
        <div class="legend-item"><div class="dot dot-yellow"></div> Warning</div>
        <div class="legend-item"><div class="dot dot-red"></div> Suspicious</div>
    </div>

    <button onclick="loadData()">Refresh Data</button>

    <div class="grid" id="tiles"></div>

    <script>
        function loadData() {
            fetch("http://127.0.0.1:5000/api/congestion")
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById("tiles");
                    container.innerHTML = "";

                    if (data.length === 0) {
                        container.innerHTML = "<p>No data found.</p>";
                        return;
                    }

                    data.forEach(record => {
                        const tile = document.createElement("div");
                        tile.className = "tile " + record.congestion_level;
                        tile.innerHTML = `
                            ${record.congestion_level === "RED" ? "🚨" : 
                              record.congestion_level === "YELLOW" ? "⚠️" : "✅"}
                            <div>${record.aisle_id.toUpperCase()}</div>
                            <div class="label">Dwell: ${record.dwell_time_sec} sec</div>
                            <div class="label">Suspicious Frames: ${record.suspicious_frames}</div>
                            <div class="label">${record.congestion_level}</div>
                        `;
                        container.appendChild(tile);
                    });
                });
        }

        loadData();
        setInterval(loadData, 10000);
    </script>
</body>
</html>
